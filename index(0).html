<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Portal</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7f5;color:#17231e}header{background:#07583f;color:#fff;text-align:center;padding:25px 15px 45px}.academy-logo{width:110px;height:110px;object-fit:contain;display:block;margin:0 auto 10px;border-radius:12px}main{max-width:900px;margin:-22px auto 35px;padding:0 15px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 25px #0001;margin-bottom:18px}input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd8d2;border-radius:9px;font-size:15px}button{padding:11px 15px;border:0;border-radius:9px;background:#07583f;color:#fff;font-weight:bold;margin:3px;cursor:pointer}.light{background:#e8f1ed;color:#07583f}.danger{background:#b52b2b}.hidden{display:none}.msg{padding:10px;border-radius:8px;margin-top:10px;background:#eef7f2}.error{background:#fff0f0;color:#a11}.success{background:#effaf2;color:#176b36}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.studentbox{border:1px solid #dce7e1;border-radius:10px;padding:13px;margin:9px 0}.resultrow{padding:7px 0;border-top:1px solid #eee;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><img src="../logo.png" class="academy-logo"><h1>VICKI DICE GRAFIKS ACADEMY</h1><div>ADMIN PORTAL</div></header><main>
<div id="login" class="card"><h2>Admin Login</h2><input id="pw" type="password" placeholder="Admin password"><button id="loginBtn">LOGIN</button><div id="loginMsg"></div></div>
<section id="dash" class="hidden">
<div class="card"><h2>➕ Add New Student</h2><div class="grid"><div><label>Student Name</label><input id="name"></div><div><label>Registration Number</label><input id="reg"></div><div><label>Department</label><input id="dept" value="GRAPHIC CREATIVE"></div></div><button id="addStudent">ADD NEW STUDENT</button><div id="sm"></div></div>
<div class="card"><h2>➕ Add Course / Result</h2><label>Student</label><select id="sel"></select><div class="grid"><div><label>Course Name</label><input id="course"></div><div><label>Course Code</label><input id="code"></div><div><label>Score</label><input id="score" type="number" min="0" max="100"></div><div><label>Grade</label><input id="grade" readonly></div><div><label>Point</label><input id="point" readonly></div></div><button id="addResult">ADD RESULT</button><div id="rm"></div></div>
<div class="card"><h2>Students & Results</h2><div id="list"></div></div>
<div class="card"><h2>🔐 Change Admin Password</h2><input id="old" type="password" placeholder="Current password"><input id="newp" type="password" placeholder="New password"><input id="conf" type="password" placeholder="Confirm new password"><button id="change">CHANGE PASSWORD</button><div id="pm"></div></div>
<div class="card"><button id="logout" class="danger">LOGOUT</button></div></section></main>
<script>
let adminPassword="",students=[];
const $=id=>document.getElementById(id);
const grade=s=>{s=Number(s);if(s>=70)return {g:"A",p:5};if(s>=60)return {g:"B",p:4};if(s>=50)return {g:"C",p:3};if(s>=45)return {g:"D",p:2};if(s>=40)return {g:"E",p:1};return {g:"F",p:0}};
function msg(id,t,c){$(id).textContent=t;$(id).className="msg "+(c||"")}
async function api(action,body={}){const r=await fetch("/.netlify/functions/portal?action="+action,{method:"POST",headers:{"content-type":"application/json","x-admin-password":adminPassword},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function load(){const r=await fetch("/.netlify/functions/portal?all=1",{cache:"no-store"});const d=await r.json();students=d.students||[];render()}
$("loginBtn").onclick=async()=>{adminPassword=$("pw").value;try{await api("login",{password:adminPassword});await load();$("login").classList.add("hidden");$("dash").classList.remove("hidden")}catch(e){msg("loginMsg","Incorrect password.","error")}};
$("addStudent").onclick=async()=>{const name=$("name").value.trim().toUpperCase(),reg=$("reg").value.trim().toUpperCase(),department=$("dept").value.trim().toUpperCase()||"GRAPHIC CREATIVE";try{const d=await api("student",{name,reg,department});students=d.students;render();$("name").value="";$("reg").value="";msg("sm","Student added successfully and saved online. The Student Portal can now find this registration number.","success")}catch(e){msg("sm",e.message,"error")}};
$("score").oninput=()=>{let z=grade($("score").value);$("grade").value=z.g;$("point").value=z.p};
$("addResult").onclick=async()=>{try{const d=await api("result",{studentIndex:Number($("sel").value),course:$("course").value,code:$("code").value,score:Number($("score").value)});students=d.students;render();$("course").value=$("code").value=$("score").value=$("grade").value=$("point").value="";msg("rm","Result saved online. It will now appear in the Student Portal.","success")}catch(e){msg("rm",e.message,"error")}};
function render(){$("sel").innerHTML=students.map((s,i)=>`<option value="${i}">${s.name} — ${s.reg}</option>`).join("");$("list").innerHTML=students.map((s,i)=>{let pts=s.results.reduce((a,r)=>a+grade(r.score).p,0),g=s.results.length?(pts/s.results.length).toFixed(2):"0.00";return `<div class="studentbox"><b>${s.name}</b> — ${s.reg}<br>${s.department} | GPA: <b>${g}</b><br>${s.results.map((r,j)=>{let z=grade(r.score);return `<div class="resultrow">${r.course} (${r.code}) — ${r.score} / ${z.g} / ${z.p} <button data-dr="${i},${j}" class="danger">Delete</button></div>`}).join("")}<br><button data-ds="${i}" class="danger">DELETE STUDENT</button></div>`}).join("")}
$("list").onclick=async e=>{try{if(e.target.dataset.dr){let [i,j]=e.target.dataset.dr.split(",").map(Number),d=await api("delete-result",{studentIndex:i,resultIndex:j});students=d.students;render()}if(e.target.dataset.ds){let i=Number(e.target.dataset.ds);if(confirm("Delete this student and all results?")){let d=await api("delete-student",{index:i});students=d.students;render()}}}catch(x){alert(x.message)}};
$("change").onclick=async()=>{try{await api("change-password",{oldPassword:$("old").value,newPassword:$("newp").value,confirmPassword:$("conf").value});msg("pm","Password changed successfully.","success");$("old").value=$("newp").value=$("conf").value=""}catch(e){msg("pm",e.message,"error")}};
$("logout").onclick=()=>location.reload();
</script></body></html>
