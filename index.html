<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Result Portal</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7f5;color:#17231e}header{background:#07583f;color:#fff;text-align:center;padding:25px 15px 45px}.academy-logo{width:110px;height:110px;object-fit:contain;display:block;margin:0 auto 10px;border-radius:12px}main{max-width:900px;margin:-22px auto 35px;padding:0 15px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 25px #0001;margin-bottom:18px}input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd8d2;border-radius:9px;font-size:15px}button{padding:11px 15px;border:0;border-radius:9px;background:#07583f;color:#fff;font-weight:bold;margin:3px;cursor:pointer}.light{background:#e8f1ed;color:#07583f}.danger{background:#b52b2b}.hidden{display:none}.msg{padding:10px;border-radius:8px;margin-top:10px;background:#eef7f2}.error{background:#fff0f0;color:#a11}.success{background:#effaf2;color:#176b36}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.studentbox{border:1px solid #dce7e1;border-radius:10px;padding:13px;margin:9px 0}.resultrow{padding:7px 0;border-top:1px solid #eee;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><img src="logo.png" class="academy-logo"><h1>VICKI DICE GRAFIKS ACADEMY</h1><div>STUDENT RESULT PORTAL</div></header><main><div class="card"><h2>Check Your Result</h2><label>Registration Number</label><input id="reg" placeholder="Enter registration number"><button id="check">CHECK RESULT</button><div id="msg"></div></div><div id="result" class="card hidden"><h2 id="name"></h2><p><b>Reg. Number:</b> <span id="r"></span></p><p><b>Department:</b> <span id="dept"></span></p><p><b>GPA:</b> <span id="gpa"></span></p><h3>Results</h3><div id="rows"></div><button onclick="window.print()">PRINT / SAVE PDF</button></div></main><script>
const $=id=>document.getElementById(id);
function grade(score){score=Number(score);if(score>=70)return{g:"A",p:5};if(score>=60)return{g:"B",p:4};if(score>=50)return{g:"C",p:3};if(score>=45)return{g:"D",p:2};if(score>=40)return{g:"E",p:1};return{g:"F",p:0}}
$("check").onclick=async()=>{const reg=$("reg").value.trim().toUpperCase();$("result").classList.add("hidden");$("msg").textContent="Loading...";try{const res=await fetch("/.netlify/functions/portal?reg="+encodeURIComponent(reg),{cache:"no-store"});const data=await res.json();if(!res.ok)throw Error(data.error||"Not found");const s=data.student;let points=s.results.reduce((a,x)=>a+grade(x.score).p,0);$("name").textContent=s.name;$("r").textContent=s.reg;$("dept").textContent=s.department;$("gpa").textContent=s.results.length?(points/s.results.length).toFixed(2):"0.00";$("rows").innerHTML=s.results.map(x=>{const z=grade(x.score);return `<div class="studentbox"><b>${x.course}</b> (${x.code})<br>Score: ${x.score} | Grade: ${z.g} | Point: ${z.p}</div>`}).join("")||"<p>No results yet.</p>";$("msg").textContent="";$("result").classList.remove("hidden")}catch(e){$("msg").textContent=e.message;$("msg").className="msg error"}};
</script></body></html>
